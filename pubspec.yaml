name: gestion_betail
description: Application complète de gestion du bétail pour bergers et éleveurs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Database
  sqflite: ^2.2.8+4
  path: ^1.8.2
  path_provider: ^2.0.15
  
  # State Management
  provider: ^6.0.7
  
  # Internationalization & Formatting
  intl: ^0.18.1
  
  # UI/Design
  google_fonts: ^5.1.0
  cupertino_icons: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
