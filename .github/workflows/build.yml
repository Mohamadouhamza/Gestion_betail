name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.13.0"
          cache: false

      - name: Nettoyer complètement tous les caches
        run: |
          flutter clean
          rm -rf build
          rm -rf ~/.gradle
          rm -rf android/.gradle
          rm -rf android/app/build
          rm -rf $PUB_CACHE/hosted/pub.dev/sqflite*
          rm -rf $PUB_CACHE/hosted/pub.dev/kotlin*

      - name: Supprimer et régénérer Android
        run: |
          rm -rf android
          flutter create --platforms=android . --project-name gestion_betail

      - name: Installer les dépendances
        run: flutter pub get

      - name: Construire l'APK debug
        run: flutter build apk --debug

      - name: Construire l'APK release
        run: flutter build apk --release

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Publier l'APK release
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk